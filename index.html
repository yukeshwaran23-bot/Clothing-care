<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#35123f">
<title>Yukes Cloth Care</title>
<style>
:root{--purple:#35123f;--purple2:#4b1c59;--gold:#d7a849;--cream:#fbf7f0;--ink:#24212a;--muted:#77727d;--line:#eee7df;--lav:#f4eafa}
*{box-sizing:border-box}
body{margin:0;background:#f3eee8;color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:14px}
button,input,select{font:inherit}
button{cursor:pointer}
.app{width:100%;max-width:520px;min-height:100vh;margin:0 auto;background:var(--cream);box-shadow:0 0 28px #24102a12}
.topbar{background:var(--purple);color:white;padding:13px 15px 12px}
.brand{font-family:Georgia,serif;font-size:21px;font-weight:700;letter-spacing:-.35px;line-height:1.2}
.brand span{color:var(--gold)}
.tagline{font-size:10px;color:#e7d9e9;margin-top:3px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:12px 12px 8px;background:var(--cream);position:sticky;top:0;z-index:3}
.tab{border:0;border-radius:13px;background:#f3eee9;color:#67616b;padding:11px 4px;font-size:13px;font-weight:700}
.tab.active{background:var(--purple);color:white;box-shadow:0 3px 8px #35123f22}
.content{padding:4px 13px 24px}
.date-panel{display:flex;align-items:center;gap:10px;background:#f8efdf;border-radius:13px;padding:12px;margin:4px 0 12px}
.date-icon{font-size:21px}
.date-title{font-weight:700;font-size:14px}
.date-value{font-size:12px;color:#68616b;margin-top:3px}
.add-button{margin-left:auto;border:0;border-radius:10px;background:var(--purple);color:white;padding:10px 11px;font-size:12px;font-weight:700;white-space:nowrap}
.add-button:active,.primary:active{transform:scale(.98)}
.cards{display:flex;flex-direction:column;gap:9px}
.cloth-card{display:grid;grid-template-columns:24px 78px minmax(0,1fr) 20px;align-items:center;gap:8px;background:#fff;border:1px solid #f0ebe5;border-radius:13px;padding:9px 8px;min-height:103px}
.check{appearance:none;width:20px;height:20px;border:1.8px solid #34303a;border-radius:5px;margin:0;display:grid;place-content:center;cursor:pointer}
.check:checked{background:var(--purple);border-color:var(--purple)}
.check:checked:after{content:"✓";color:white;font-size:14px;font-weight:bold}
.cloth-photo{width:78px;height:82px;object-fit:cover;border-radius:9px;background:#f0ece8}
.cloth-name{font-size:14px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.usage{display:inline-flex;align-items:center;gap:5px;background:var(--lav);color:var(--purple);border-radius:7px;padding:5px 7px;margin-top:6px;font-size:11px;font-weight:700}
.last-used{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.25}
.more{align-self:start;border:0;background:transparent;color:#6f6872;font-size:18px;padding:0 2px}.card-actions{position:relative;display:flex;flex-direction:column;align-items:flex-end}.action-menu{position:absolute;right:0;top:25px;z-index:5;min-width:104px;background:white;border:1px solid #e8dfea;border-radius:10px;box-shadow:0 6px 20px #24102a20;padding:5px}.action-menu button{display:block;width:100%;text-align:left;border:0;background:white;padding:9px 10px;border-radius:7px;font-size:12px;color:var(--ink)}.action-menu button:hover{background:var(--lav)}.action-menu .danger{color:#b42318}.history-row{grid-template-columns:62px minmax(0,1fr) 22px}.history-actions{position:relative;align-self:start;justify-self:end;grid-column:3;grid-row:1}.history-actions .more{font-size:19px;line-height:1;padding:0 2px}
.empty{background:white;border:1px dashed #d9cedc;border-radius:14px;padding:26px 18px;text-align:center;color:var(--muted);line-height:1.6}
.history-list{display:flex;flex-direction:column;gap:8px}
.history-row{display:grid;grid-template-columns:62px minmax(0,1fr) 22px;gap:8px;align-items:center;background:white;border:1px solid #f0ebe5;border-radius:12px;padding:10px}
.history-date{font-size:11px;font-weight:700;color:var(--purple);white-space:nowrap}
.outfit{display:flex;align-items:center;gap:7px;min-width:0}
.mini-item{display:flex;align-items:center;gap:5px;min-width:0;flex:1}
.mini-item img{width:34px;height:38px;object-fit:cover;border-radius:6px;background:#f0ece8;flex-shrink:0}
.mini-item span{font-size:11px;font-weight:600;overflow-wrap:anywhere}
.dash{color:#a69aa9;font-weight:700}
.history-note{font-size:11px;color:var(--muted);margin-top:4px}
.modal-backdrop{position:fixed;inset:0;background:#16091bcc;display:none;align-items:flex-end;justify-content:center;z-index:10;padding:0}
.modal-backdrop.show{display:flex}
.modal{width:100%;max-width:520px;max-height:90vh;overflow:auto;background:var(--cream);border-radius:20px 20px 0 0;padding:18px 17px 24px;box-shadow:0 -10px 35px #0002}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}
.modal-title{font-size:18px;font-weight:700;color:var(--purple)}
.close{border:0;background:#eee6f0;border-radius:50%;width:32px;height:32px;font-size:20px;color:var(--purple)}
.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.field label{font-size:12px;font-weight:700}
.field input,.field select{width:100%;border:1px solid #ddd3df;border-radius:10px;background:white;padding:11px 12px;outline:none;color:var(--ink);font-size:14px}
.field input:focus,.field select:focus{border-color:var(--purple)}
.preview{display:none;width:78px;height:82px;object-fit:cover;border-radius:9px;margin-top:8px}
.primary{width:100%;border:0;background:var(--purple);color:white;border-radius:11px;padding:13px;font-weight:700;margin-top:8px}
.secondary{width:100%;border:1px solid #d8cbdc;background:white;color:var(--purple);border-radius:11px;padding:11px;font-weight:700;margin-top:8px}
.small-note{font-size:11px;color:var(--muted);line-height:1.5;margin-top:8px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#211027;color:white;padding:11px 15px;border-radius:10px;font-size:12px;display:none;z-index:20;max-width:90%;text-align:center}
.toast.show{display:block}
@media(min-width:600px){body{padding:22px 0}.app{border-radius:20px;overflow:hidden;min-height:calc(100vh - 44px)}.modal-backdrop{align-items:center;padding:18px}.modal{border-radius:20px;max-height:85vh}.topbar{padding-top:23px}.content{padding-left:17px;padding-right:17px}}
@media(max-width:360px){.brand{font-size:20px}.content{padding-left:9px;padding-right:9px}.cloth-card{grid-template-columns:21px 66px minmax(0,1fr) 16px;gap:6px;padding:8px 6px}.cloth-photo{width:66px;height:74px}.cloth-name{font-size:13px}.usage{font-size:10px;padding:5px}.add-button{padding:9px 8px;font-size:11px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span>Yukes</span> Cloth Care</div>
    <div class="tagline">Track your outfits, one day at a time</div>
  </header>
  <nav class="tabs" aria-label="Clothing sections">
    <button class="tab active" data-tab="shirts">♟ Shirts</button>
    <button class="tab" data-tab="pants">▰ Pants</button>
    <button class="tab" data-tab="history">◷ History</button>
  </nav>
  <main class="content">
    <section class="date-panel">
      <div class="date-icon">▦</div>
      <div><div class="date-title" id="dateTitle">Today</div><div class="date-value" id="dateValue"></div></div>
      <button class="add-button" id="addButton">＋ Add Shirt</button>
    </section>
    <section id="mainList" class="cards" aria-live="polite"></section>
  </main>
</div>

<div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <form class="modal" id="clothForm">
    <div class="modal-head"><div class="modal-title" id="modalTitle">Add Shirt</div><button type="button" class="close" id="closeModal" aria-label="Close">×</button></div>
    <div class="field"><label for="clothName">Clothing name</label><input id="clothName" maxlength="50" placeholder="e.g. Blue Shirt" required></div>
    <div class="field"><label for="clothPhoto">Clothing image (optional)</label><input id="clothPhoto" type="file" accept="image/*"><img class="preview" id="photoPreview" alt="Selected clothing preview"></div>
    <div class="field"><label for="clothColor">Color (optional)</label><input id="clothColor" maxlength="30" placeholder="e.g. Blue"></div>
    <button class="primary" type="submit" id="saveButton">Save Shirt</button>
    <button class="secondary" type="button" id="cancelButton">Cancel</button>
    <div class="small-note">Clothing data syncs to the shared Firebase wardrobe when cloud setup is enabled. Keep images reasonably small.</div>
  </form>
</div>
<div class="modal-backdrop" id="historyModalBackdrop" role="dialog" aria-modal="true" aria-labelledby="historyModalTitle">
  <form class="modal" id="historyForm">
    <div class="modal-head"><div class="modal-title" id="historyModalTitle">Edit Outfit History</div><button type="button" class="close" id="closeHistoryModal" aria-label="Close">×</button></div>
    <div class="field"><label for="historyDate">Outfit date</label><input id="historyDate" type="date" required></div>
    <div class="field"><label for="historyShirt">Shirt</label><select id="historyShirt" required></select></div>
    <div class="field"><label for="historyPant">Pant</label><select id="historyPant" required></select></div>
    <button class="primary" type="submit">Save History</button><button class="secondary" type="button" id="cancelHistoryModal">Cancel</button>
  </form>
</div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
// Firebase Web App config. No Authentication is used in this version.
const firebaseConfig = {
  apiKey: "AIzaSyD18NFFxZaWqk-1LzI1Wt7U2K3RaZnNRkU",
  authDomain: "clothing-care.firebaseapp.com",
  projectId: "clothing-care",
  storageBucket: "clothing-care.firebasestorage.app",
  messagingSenderId: "310465609769",
  appId: "1:310465609769:web:dc12c9726ec2428a6bdc38",
  measurementId: "G-9FCSF34VEH"
};
let cloudDb = null;
// Shared no-login workspace. Anyone with access to the app can access this data if rules are public.
const CLOUD_ROOT = "publicWardrobes/yukesClothCare";
let cloudReady = false, cloudSyncBusy = false, cloudSyncAgain = false;

const STORAGE_KEY = "yukesClothCare_v1";
const HISTORY_KEY = "yukesClothCareHistory_v1";
const todayKey = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
};
const formatDate = key => {
  const [y,m,d] = key.split("-").map(Number);
  return `${String(d).padStart(2,"0")}.${String(m).padStart(2,"0")}.${String(y).slice(-2)}`;
};
const relativeDate = key => {
  if (!key) return "Not used yet";
  const now = new Date(); now.setHours(0,0,0,0);
  const d = new Date(key+"T00:00:00"); d.setHours(0,0,0,0);
  const diff = Math.round((now-d)/86400000);
  if (diff <= 0) return "Used today";
  if (diff === 1) return "Used yesterday";
  if (diff < 7) return `Used ${diff} days ago`;
  if (diff === 7) return "Used 1 week ago";
  return `Last used ${formatDate(key)}`;
};
const safeRead = (key, fallback) => { try { return JSON.parse(localStorage.getItem(key)) || fallback; } catch { return fallback; } };
let clothes = safeRead(STORAGE_KEY, []);
let history = safeRead(HISTORY_KEY, []).map(h => ({...h, id: h.id || (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()+Math.random()))}));
let activeTab = "shirts";
let pendingImage = "";
let checkedShirt = "";
let checkedPant = "";
let editingHistoryId = "";
let editingClothId = "";
let editingHistoryDate = "";
let pendingHistoryDate = "";

const defaultImage = type => {
  const svg = type === "shirt"
    ? `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140"><rect width="120" height="140" rx="12" fill="#f1ece7"/><path d="M38 24 49 17 60 31 71 17 82 24 104 39 91 61 82 54 82 123 38 123 38 54 29 61 16 39Z" fill="#b6cde4" stroke="#7d9ab8" stroke-width="2"/><path d="M49 17 Q60 42 71 17 M60 31 V120" fill="none" stroke="#7d9ab8" stroke-width="2"/><circle cx="64" cy="51" r="1.5" fill="#fff"/><circle cx="64" cy="64" r="1.5" fill="#fff"/></svg>`
    : `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140"><rect width="120" height="140" rx="12" fill="#f1ece7"/><path d="M34 20H86L92 51 82 124H62L58 67 54 124H34L28 51Z" fill="#344b69" stroke="#26364d" stroke-width="2"/><path d="M34 20H86L82 32H38Z" fill="#526b89"/><path d="M60 25V62" stroke="#a6b2c2" stroke-width="2"/></svg>`;
  return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
};
function saveData(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(clothes));
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
  if (cloudReady) syncCloudData();
}
async function uploadImageIfNeeded(item){
  // No Firebase Storage: keep a compressed image data URL inside the Firestore document.
  // New uploads are compressed below to keep each document safely under Firestore limits.
  return item.image || "";
}
async function syncCloudData(){
  if(!cloudReady || !cloudDb) return;
  if(cloudSyncBusy){cloudSyncAgain=true;return;}
  cloudSyncBusy=true;
  try{
    const userRoot=cloudDb.doc(CLOUD_ROOT);
    const clothesCol=userRoot.collection("clothes");
    const historyCol=userRoot.collection("history");
    const remoteClothes=await clothesCol.get();
    const remoteHistory=await historyCol.get();
    const batch=cloudDb.batch();
    const keepClothes=new Set();
    for(const item of clothes){
      const image=await uploadImageIfNeeded(item);
      if(image && image!==item.image){item.image=image;localStorage.setItem(STORAGE_KEY,JSON.stringify(clothes));}
      keepClothes.add(item.id);
      batch.set(clothesCol.doc(String(item.id)), {...item, image: image || ""});
    }
    remoteClothes.forEach(doc=>{if(!keepClothes.has(doc.id)) batch.delete(doc.ref);});
    const keepHistory=new Set();
    history.forEach((entry,index)=>{
      const id=String(entry.id || `${entry.date}_${index}`); entry.id=id; keepHistory.add(id);
      batch.set(historyCol.doc(id), entry);
    });
    remoteHistory.forEach(doc=>{if(!keepHistory.has(doc.id)) batch.delete(doc.ref);});
    await batch.commit();
    localStorage.setItem(HISTORY_KEY,JSON.stringify(history));
  }catch(error){
    console.error("Firebase sync failed:",error);
    showToast("Cloud sync failed. Check Firebase setup and connection.");
  }finally{
    cloudSyncBusy=false;
    if(cloudSyncAgain){cloudSyncAgain=false;syncCloudData();}
  }
}
async function initFirebaseCloud(){
  const configured = firebaseConfig.apiKey !== "PASTE_API_KEY_HERE" && firebaseConfig.projectId !== "PASTE_PROJECT_ID_HERE" && firebaseConfig.appId !== "PASTE_APP_ID_HERE";
  if(!configured){showToast("Add your Firebase web config to enable cloud sync.");return;}
  try{
    firebase.initializeApp(firebaseConfig);
    cloudDb=firebase.firestore();
    // No sign-in: all devices use the same shared cloud wardrobe path.
    const userRoot=cloudDb.doc(CLOUD_ROOT);
    const [remoteClothes,remoteHistory]=await Promise.all([userRoot.collection("clothes").get(),userRoot.collection("history").get()]);
    if(!remoteClothes.empty || !remoteHistory.empty){
      clothes=remoteClothes.docs.map(d=>d.data());
      history=remoteHistory.docs.map(d=>d.data());
      localStorage.setItem(STORAGE_KEY,JSON.stringify(clothes));
      localStorage.setItem(HISTORY_KEY,JSON.stringify(history));
      render();
    } else if(clothes.length || history.length){
      // First-time migration: upload this browser's saved items into the shared Firebase wardrobe.
      cloudReady=true; await syncCloudData();
    }
    cloudReady=true;
    showToast("Firebase cloud sync connected (no login).");
    await syncCloudData();
  }catch(error){
    console.error("Firebase initialization failed:",error);
    showToast("Firebase setup failed. Check Firestore/Firestore rules and configuration.");
  }
}
function showToast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2300);}
function setDate(){const d=new Date();document.getElementById("dateValue").textContent=d.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric",weekday:"long"});}
function currentItems(type){return clothes.filter(c=>c.type===type).sort((a,b)=>a.name.localeCompare(b.name));}
function render(){
  setDate();
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===activeTab));
  const add=document.getElementById("addButton");
  add.style.display=activeTab==="history"?"none":"block";
  add.textContent=activeTab==="shirts"?"＋ Add Shirt":"＋ Add Pant";
  document.getElementById("dateTitle").textContent=activeTab==="history"?"Outfit History":"Today";
  if(activeTab==="history"){const dayCount=new Set(history.map(h=>h.date)).size;document.getElementById("dateValue").textContent=`${dayCount} days recorded · ${history.length} outfits`; }
  const list=document.getElementById("mainList");
  if(activeTab==="history"){renderHistory(list);return;}
  const type=activeTab==="shirts"?"shirt":"pant";
  const items=currentItems(type);
  if(!items.length){list.innerHTML=`<div class="empty">No ${type==="shirt"?"shirts":"pants"} added yet.<br>Tap <b>＋ Add ${type==="shirt"?"Shirt":"Pant"}</b> to add your first item.</div>`;return;}
  list.innerHTML=items.map(c=>`
    <article class="cloth-card">
      <input class="check" type="checkbox" aria-label="Select ${escapeHtml(c.name)}" data-id="${c.id}" ${((type==="shirt"&&checkedShirt===c.id)||(type==="pant"&&checkedPant===c.id))?"checked":""}>
      <img class="cloth-photo" src="${c.image||defaultImage(type)}" alt="${escapeHtml(c.name)}">
      <div>
        <div class="cloth-name">${escapeHtml(c.name)}</div>
        <div class="usage">${type==="shirt"?"♟":"▰"} &nbsp;${c.count||0} ${((c.count||0)===1)?"time":"times"} used</div>
        <div class="last-used">◷ &nbsp;${relativeDate(c.lastUsed)}</div>
      </div>
      <div class="card-actions"><button class="more" title="Edit or delete ${escapeHtml(c.name)}" aria-label="Edit or delete ${escapeHtml(c.name)}" data-cloth-menu="${c.id}">⋮</button></div>
    </article>`).join("");
  list.querySelectorAll(".check").forEach(box=>box.addEventListener("change",()=>selectCloth(type,box.dataset.id,box.checked)));
  list.querySelectorAll("[data-cloth-menu]").forEach(btn=>btn.addEventListener("click",()=>toggleActionMenu(btn, btn.dataset.clothMenu, "cloth")));
}
function renderHistory(list){
  if(!history.length){list.innerHTML='<div class="empty">No outfit history yet.<br>Select one shirt and one pant, then confirm today’s outfit.</div>';return;}
  list.innerHTML=history.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(h=>{
    const shirt=clothes.find(c=>c.id===h.shirtId),pant=clothes.find(c=>c.id===h.pantId);
    return `<article class="history-row"><div class="history-date">${formatDate(h.date)}</div><div><div class="outfit"><div class="mini-item">${shirt?`<img src="${shirt.image||defaultImage("shirt")}" alt="">`:""}<span>${escapeHtml(h.shirtName||shirt?.name||"Deleted shirt")}</span></div><span class="dash">–</span><div class="mini-item">${pant?`<img src="${pant.image||defaultImage("pant")}" alt="">`:""}<span>${escapeHtml(h.pantName||pant?.name||"Deleted pant")}</span></div></div></div><div class="history-actions"><button class="more" title="Edit or delete history" aria-label="Edit or delete history" data-history-menu="${escapeHtml(h.id)}">⋮</button></div></article>`;
  }).join("");
  list.querySelectorAll("[data-history-menu]").forEach(btn=>btn.addEventListener("click",()=>toggleActionMenu(btn, btn.dataset.historyMenu, "history")));
}
function selectCloth(type,id,checked){
  if(type==="shirt") checkedShirt=checked?id:"";
  else checkedPant=checked?id:"";
  if(checkedShirt&&checkedPant){
    const shirt=clothes.find(c=>c.id===checkedShirt),pant=clothes.find(c=>c.id===checkedPant);
    if(!shirt||!pant)return;
    const key=todayKey();
    const duplicate=history.some(h=>h.date===key&&h.shirtId===shirt.id&&h.pantId===pant.id);
    if(duplicate){
      saveData();checkedShirt="";checkedPant="";showToast("This exact outfit is already recorded for today.");render();return;
    }
    history.push({id:(crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random())),date:key,shirtId:shirt.id,pantId:pant.id,shirtName:shirt.name,pantName:pant.name});
    shirt.count=(shirt.count||0)+1; pant.count=(pant.count||0)+1;
    shirt.lastUsed=key;pant.lastUsed=key;
    saveData();checkedShirt="";checkedPant="";
    showToast("Today's outfit saved to History!");
    render();
  } else {
    showToast(checked?"Selected. Now select a matching "+(type==="shirt"?"pant":"shirt")+".":"Selection cleared.");
  }
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function openModal(clothId=""){
  pendingImage="";editingClothId=clothId;document.getElementById("clothForm").reset();
  const preview=document.getElementById("photoPreview");preview.style.display="none";
  const type=clothId?(clothes.find(c=>c.id===clothId)?.type):(activeTab==="shirts"?"shirt":"pant");
  const existing=clothId?clothes.find(c=>c.id===clothId):null;
  document.getElementById("modalTitle").textContent=(existing?"Edit ":"Add ")+(type==="shirt"?"Shirt":"Pant");
  document.getElementById("saveButton").textContent=(existing?"Save Changes":"Save ")+(existing?"":(type==="shirt"?"Shirt":"Pant"));
  document.getElementById("modalBackdrop").dataset.type=type;
  if(existing){document.getElementById("clothName").value=existing.name;document.getElementById("clothColor").value=existing.color||"";pendingImage=existing.image||"";if(pendingImage){preview.src=pendingImage;preview.style.display="block";}}
  document.getElementById("modalBackdrop").classList.add("show");
  setTimeout(()=>document.getElementById("clothName").focus(),100);
}
function toggleActionMenu(button,id,kind){
  document.querySelectorAll(".action-menu").forEach(m=>m.remove());
  const wrap=button.parentElement;const menu=document.createElement("div");menu.className="action-menu";
  menu.innerHTML='<button type="button" data-action="edit">Edit</button><button type="button" class="danger" data-action="delete">Delete</button>';
  wrap.appendChild(menu);
  menu.querySelector('[data-action="edit"]').addEventListener("click",()=>{menu.remove();if(kind==="cloth")openModal(id);else openHistoryModal(id);});
  menu.querySelector('[data-action="delete"]').addEventListener("click",()=>{menu.remove();if(kind==="cloth")deleteCloth(id);else deleteHistory(id);});
  setTimeout(()=>{const close=e=>{if(!menu.contains(e.target)&&e.target!==button){menu.remove();document.removeEventListener("click",close);}};document.addEventListener("click",close);},0);
}
function openHistoryModal(id){
  const h=history.find(x=>x.id===id);if(!h)return;editingHistoryId=id;
  const shirtSelect=document.getElementById("historyShirt"),pantSelect=document.getElementById("historyPant");
  shirtSelect.innerHTML=clothes.filter(c=>c.type==="shirt").map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join("");
  pantSelect.innerHTML=clothes.filter(c=>c.type==="pant").map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join("");
  if(!shirtSelect.options.length||!pantSelect.options.length){showToast("Add at least one shirt and one pant before editing history.");return;}
  document.getElementById("historyDate").value=h.date;shirtSelect.value=h.shirtId;pantSelect.value=h.pantId;
  document.getElementById("historyModalBackdrop").classList.add("show");
}
function closeHistoryModal(){document.getElementById("historyModalBackdrop").classList.remove("show");}
function deleteHistory(id){const entry=history.find(h=>h.id===id);if(!entry)return;if(!confirm(`Delete outfit history for ${formatDate(entry.date)}?`))return;history=history.filter(h=>h.id!==id);saveData();render();showToast("History entry deleted.");}
function closeModal(){document.getElementById("modalBackdrop").classList.remove("show");}
function deleteCloth(id){
  const c=clothes.find(x=>x.id===id);if(!c)return;
  if(!confirm(`Delete ${c.name}?`))return;
  clothes=clothes.filter(x=>x.id!==id);
  if(checkedShirt===id)checkedShirt="";if(checkedPant===id)checkedPant="";
  saveData();render();showToast("Clothing item deleted.");
}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{activeTab=b.dataset.tab;render();}));
document.getElementById("addButton").addEventListener("click",openModal);
document.getElementById("closeModal").addEventListener("click",closeModal);
document.getElementById("cancelButton").addEventListener("click",closeModal);
document.getElementById("modalBackdrop").addEventListener("click",e=>{if(e.target.id==="modalBackdrop")closeModal();});
document.getElementById("clothPhoto").addEventListener("change",e=>{
  const file=e.target.files[0];if(!file)return;
  if(!file.type.startsWith("image/")){showToast("Please choose an image file.");return;}
  if(file.size>12000000){showToast("Please choose an image under 12 MB.");e.target.value="";return;}
  const reader=new FileReader();reader.onload=()=>{
    const img=new Image();img.onload=()=>{
      const maxSide=600,scale=Math.min(1,maxSide/Math.max(img.width,img.height));
      const canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));
      const ctx=canvas.getContext("2d");ctx.drawImage(img,0,0,canvas.width,canvas.height);
      let quality=0.68,data=canvas.toDataURL("image/jpeg",quality);
      while(data.length>500000 && quality>0.30){quality-=0.08;data=canvas.toDataURL("image/jpeg",quality);}
      if(data.length>700000){showToast("This image is too large after compression. Try another photo.");return;}
      pendingImage=data;const p=document.getElementById("photoPreview");p.src=pendingImage;p.style.display="block";
    };img.onerror=()=>showToast("Could not read this image. Please choose another.");img.src=reader.result;
  };reader.readAsDataURL(file);
});
document.getElementById("clothForm").addEventListener("submit",e=>{
  e.preventDefault();
  const name=document.getElementById("clothName").value.trim();
  if(!name){showToast("Enter a clothing name.");return;}
  const type=document.getElementById("modalBackdrop").dataset.type;
  if(editingClothId){
    const item=clothes.find(c=>c.id===editingClothId);
    if(item){const oldName=item.name;item.name=name;item.color=document.getElementById("clothColor").value.trim();item.image=pendingImage;history.forEach(h=>{if(h.shirtId===item.id)h.shirtName=name;if(h.pantId===item.id)h.pantName=name;});}
    editingClothId="";saveData();closeModal();render();showToast("Clothing item updated!");
  }else{
    clothes.push({id:(crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random())),type,name,image:pendingImage,color:document.getElementById("clothColor").value.trim(),count:0,lastUsed:""});
    saveData();closeModal();render();showToast((type==="shirt"?"Shirt":"Pant")+" added successfully!");
  }
});
document.getElementById("closeHistoryModal").addEventListener("click",closeHistoryModal);
document.getElementById("cancelHistoryModal").addEventListener("click",closeHistoryModal);
document.getElementById("historyModalBackdrop").addEventListener("click",e=>{if(e.target.id==="historyModalBackdrop")closeHistoryModal();});
document.getElementById("historyForm").addEventListener("submit",e=>{
  e.preventDefault();const h=history.find(x=>x.id===editingHistoryId);if(!h)return;
  const newDate=document.getElementById("historyDate").value,shirt=clothes.find(c=>c.id===document.getElementById("historyShirt").value),pant=clothes.find(c=>c.id===document.getElementById("historyPant").value);
  if(!newDate||!shirt||!pant){showToast("Choose a date, shirt, and pant.");return;}
  const duplicate=history.some(x=>x.id!==editingHistoryId&&x.date===newDate&&x.shirtId===shirt.id&&x.pantId===pant.id);
  if(duplicate){showToast("This exact outfit is already recorded for that date.");return;}
  h.date=newDate;h.shirtId=shirt.id;h.pantId=pant.id;h.shirtName=shirt.name;h.pantName=pant.name;
  closeHistoryModal();saveData();render();showToast("History entry updated!");
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();closeHistoryModal();});
render();
initFirebaseCloud();
</script>
